version: '3.9'

networks:
  app-network:

services:
  assessement:
    image: assessement
    build: .
    hostname: assessement
    container_name: assessement
    ports:
      - '3000:3000'
    depends_on:
      - db
    env_file:
      - .env
    networks:
      - app-network

  db:
    image: postgres:17
    container_name: db
    hostname: db
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=assessment_db
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
    networks:
      - app-network
